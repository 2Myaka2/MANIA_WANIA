[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mania-wania"
dynamic = ["version"]
description = "MANIA scientific backend for molecular dynamics trajectory preprocessing and analysis."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrey" }
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
md = [
    "MDAnalysis",
]
science = [
    "MDAnalysis",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
mania = "mania.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mania._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_scientific: local-only scientific tests that are skipped by default unless explicitly enabled",
    "requires_mdanalysis: tests that require MDAnalysis to be installed",
    "requires_real_md_data: tests that require a local real MD reference package or dataset",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "data/reference/**/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mania"]
